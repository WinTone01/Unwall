# Zapret Linux Türkiye - hazır strateji profilleri
#
# Biçim (boru ile ayrılmış, 4 alan):
#   motor|kimlik|etiket|argümanlar
#
# motor : zapret2 (nfqws2, LUA motoru) veya zapret (nfqws, klasik motor)
# kimlik: config dosyasında STRATEGY= değeri olarak saklanan ad
# etiket: arayüzde görünen isim
#
# "analiz" kimliği özeldir: blockcheck sonucu config'teki CUSTOM_ARGS
# alanından okunur, bu dosyadan değil.
#
# Argümanlar doğrudan nfqws/nfqws2'ye verilir. --qnum, --filter-tcp,
# --filter-udp, --hostlist*, --fwmark ve --lua-init parametrelerini
# zapret-turkeyctl kendisi ekler; buraya yazmayın. Portlar config
# dosyasındaki PORTS_TCP / PORTS_UDP ile belirlenir.
#
# Operatör profilleri iki kaynaktan geliyor: bu projenin Windows sürümü ve
# splitwire-turkey (github.com/cagritaskn/splitwire-turkey) presets.txt.

# --- Zapret2 (LUA motoru) ---
zapret2|turk-telekom|Türk Telekom|--payload=tls_client_hello --lua-desync=multidisorder:pos=2:seqovl=1|Türk Telekom
zapret2|superonline|Superonline|--payload=tls_client_hello --lua-desync=multidisorder:pos=2:seqovl=1|Superonline
zapret2|superonline-alt|Superonline Alternatif|--payload=tls_client_hello --lua-desync=multisplit:blob=fake_default_tls:ip_ttl=3:pos=2:nodrop:repeats=1|Superonline (alternative)
zapret2|kablonet|Kablonet|--payload=tls_client_hello --lua-desync=multidisorder:pos=2:seqovl=1|Kablonet
zapret2|vodafone|Vodafone|--payload=tls_client_hello --lua-desync=multisplit:blob=fake_default_tls:ip_ttl=5:pos=2:nodrop:repeats=1|Vodafone
zapret2|turkcell-mobil|Turkcell Mobil / Hotspot|--payload=tls_client_hello --lua-desync=fake:blob=0x00000000:ip_ttl=3:repeats=1|Turkcell mobile / hotspot
zapret2|telekom-mobil|Telekom Mobil|--payload=tls_client_hello --lua-desync=fake:blob=0x00000000:ip_ttl=5:repeats=1|Telekom mobile

# --- Zapret (klasik motor) ---
zapret|turk-telekom|Türk Telekom|--dpi-desync=fake --dpi-desync-ttl=4|Türk Telekom
zapret|tt-alternatif|Türk Telekom Alternatif|--dpi-desync=fake --dpi-desync-ttl=3|Türk Telekom (alternative)
zapret|superonline|Superonline|--dpi-desync=fake --dpi-desync-fooling=md5sig|Superonline
zapret|sol-alternatif|Superonline Alternatif|--dpi-desync=fake --dpi-desync-fooling=md5sig --dpi-desync-ttl=3|Superonline (alternative)
zapret|kablonet|Kablonet|--dpi-desync=fake --dpi-desync-ttl=4|Kablonet
zapret|turkcell-mobil|Turkcell Mobil / Hotspot|--dpi-desync=fake --dpi-desync-ttl=1 --dpi-desync-autottl=3|Turkcell mobile / hotspot
zapret|vodafone-mobil|Vodafone Mobil / Hotspot|--dpi-desync=multisplit --dpi-desync-split-pos=2|Vodafone mobile / hotspot
# Operatöre özel olmayan, zapret belgelerindeki yaygın genel stratejiler.
# Yukarıdakiler işe yaramazsa bunları deneyin.
zapret|genel-badseq|Genel: fakedsplit + badseq|--dpi-desync=fakedsplit --dpi-desync-split-pos=1 --dpi-desync-fooling=badseq|Generic: fakedsplit + badseq
zapret|genel-multidisorder|Genel: multidisorder|--dpi-desync=multidisorder --dpi-desync-split-pos=1,midsld --dpi-desync-fooling=badseq|Generic: multidisorder
zapret|genel-autottl|Genel: fake + autottl|--dpi-desync=fake --dpi-desync-autottl=2 --dpi-desync-repeats=6|Generic: fake + autottl
