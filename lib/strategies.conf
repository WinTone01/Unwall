# Unwall - ready-made strategy profiles / hazır strateji profilleri
#
# Biçim (boru ile ayrılmış, 4 alan):
#   motor|kimlik|etiket|argümanlar
#
# motor : zapret2 (nfqws2, LUA motoru) veya zapret (nfqws, klasik motor)
# kimlik: config dosyasında STRATEGY= değeri olarak saklanan ad
# etiket: arayüzde görünen isim
#
# "analiz" kimliği özeldir: blockcheck sonucu config'teki CUSTOM_ARGS
# alanından okunur, bu dosyadan değil.
#
# Argümanlar doğrudan nfqws/nfqws2'ye verilir. --qnum, --filter-tcp,
# --filter-udp, --hostlist*, --fwmark ve --lua-init parametrelerini
# unwallctl kendisi ekler; buraya yazmayın. Portlar config
# dosyasındaki PORTS_TCP / PORTS_UDP ile belirlenir.
#
# Country prefixes (TR · ...) group carrier-specific profiles. To add your
# own country, copy a line and change the id, label and arguments; nothing
# else needs to be touched.
#
# Turkish profiles come from two sources: the Windows predecessor of this
# project and splitwire-turkey (github.com/cagritaskn/splitwire-turkey).

# --- Zapret2 (LUA motoru) ---
zapret2|turk-telekom|TR · Türk Telekom|--payload=tls_client_hello --lua-desync=multidisorder:pos=2:seqovl=1|TR · Türk Telekom
zapret2|superonline|TR · Superonline|--payload=tls_client_hello --lua-desync=multidisorder:pos=2:seqovl=1|TR · Superonline
zapret2|superonline-alt|TR · Superonline Alternatif|--payload=tls_client_hello --lua-desync=multisplit:blob=fake_default_tls:ip_ttl=3:pos=2:nodrop:repeats=1|TR · Superonline (alternative)
zapret2|kablonet|TR · Kablonet|--payload=tls_client_hello --lua-desync=multidisorder:pos=2:seqovl=1|TR · Kablonet
zapret2|vodafone|TR · Vodafone|--payload=tls_client_hello --lua-desync=multisplit:blob=fake_default_tls:ip_ttl=5:pos=2:nodrop:repeats=1|TR · Vodafone
zapret2|turkcell-mobil|TR · Turkcell Mobil / Hotspot|--payload=tls_client_hello --lua-desync=fake:blob=0x00000000:ip_ttl=3:repeats=1|TR · Turkcell mobile / hotspot
zapret2|telekom-mobil|TR · Telekom Mobil|--payload=tls_client_hello --lua-desync=fake:blob=0x00000000:ip_ttl=5:repeats=1|TR · Telekom mobile

# --- Zapret (klasik motor) ---
