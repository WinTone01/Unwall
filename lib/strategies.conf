zapret|tt-alternatif|TR · Türk Telekom Alternatif|--dpi-desync=fake --dpi-desync-ttl=3|TR · Türk Telekom (alternative)
zapret|superonline|TR · Superonline|--dpi-desync=fake --dpi-desync-fooling=md5sig|TR · Superonline
zapret|sol-alternatif|TR · Superonline Alternatif|--dpi-desync=fake --dpi-desync-fooling=md5sig --dpi-desync-ttl=3|TR · Superonline (alternative)
zapret|kablonet|TR · Kablonet|--dpi-desync=fake --dpi-desync-ttl=4|TR · Kablonet
zapret|turkcell-mobil|TR · Turkcell Mobil / Hotspot|--dpi-desync=fake --dpi-desync-ttl=1 --dpi-desync-autottl=3|TR · Turkcell mobile / hotspot
