# Zapret Linux Türkiye yapılandırması
# Bu dosya hem zapret-turkeyctl hem systemd birimi tarafından okunur.
# Değerleri elle düzenleyebilir ya da `zapret-turkeyctl config set KEY=VAL` ile
# değiştirebilirsiniz. Kabuk sözdizimi (KEY=VALUE), tırnak kullanabilirsiniz.

# Motor: zapret2 (LUA) | zapret (klasik)
ENGINE=zapret2

# Strateji kimliği (bkz. `zapret-turkeyctl strategies`) ya da "analiz"
STRATEGY=turk-telekom

# STRATEGY=analiz iken kullanılacak argümanlar (blockcheck sonucu buraya yazılır)
CUSTOM_ARGS=

# Hostlist modu: off | auto | manual
#   off    : tüm trafik motordan geçer
#   auto   : zapret engellenen domainleri kendi öğrenir (autohostlist.txt)
#   manual : yalnızca hostlist.txt içindeki domainler
HOSTLIST_MODE=auto

# NFQUEUE kuyruk numarası. Sistemde upstream zapret kuruluysa (varsayılan 200)
# çakışmamak için farklı bir numara kullanıyoruz.
QNUM=210

# İşlenecek portlar. Boş bırakılırsa o protokol için kural eklenmez.
# UDP: 443 = QUIC/HTTP3, 50000-50100 = Discord sesli sohbet.
# QUIC/HTTP3 sorun çıkarırsa PORTS_UDP=50000-50100 yapıp 443'ü çıkarın.
PORTS_TCP=80,443
PORTS_UDP=443,50000-50100

# Ağ geçidi modu: 1 yapılırsa PC yerel ağdaki cihazlar (konsol, TV) için
# NAT yapan bir router gibi davranır ve onların trafiği de zapret'ten geçer.
GATEWAY_MODE=0

# Ağ geçidi modunda internete çıkılan arayüz. Boş = otomatik tespit.
WAN_IFACE=

# IPv6 trafiğini de işle (0/1). Çoğu ISS'de gerekmez.
ENABLE_IPV6=0
